[pytest]
testpaths = selenium-tests/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=selenium-tests/reports/selenium-test-report.html --self-contained-html
markers =
    auth: authentication and role selection tests
    dashboard: dashboard verification tests
    notices: notice creation, search, edit, delete tests
    rbac: role based access control tests
