name: Appium Mobile Automation E2E Testing

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-android-tests:
    name: Appium Android Mobile E2E Automation
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@smartnoticeboard.edu' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Password123!' }}
      FACULTY_EMAIL: ${{ secrets.FACULTY_EMAIL || 'faculty@smartnoticeboard.edu' }}
      FACULTY_PASSWORD: ${{ secrets.FACULTY_PASSWORD || 'Password123!' }}
      STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'student@smartnoticeboard.edu' }}
      STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD || 'Password123!' }}
      BACKEND_URL: "http://127.0.0.1:8000"
      APPIUM_SERVER_URL: "http://127.0.0.1:4723"
      ANDROID_DEVICE_NAME: "emulator-5554"
      ANDROID_PLATFORM_VERSION: "10.0"
      APP_PACKAGE: "com.smartnoticeboard.app"
      APP_ACTIVITY: ".MainActivity"

    steps:
      # ── 1. Checkout Repository ──────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Hardware Acceleration Check ──────────────────────────────────────
      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Checking KVM support..."
          ls -l /dev/kvm || true
          sudo chmod 777 /dev/kvm || true

      # ── 3. Environment Setup ────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      # ── 4. Install Appium 2 & UiAutomator2 Driver ───────────────────────────
      - name: Install Appium & Android Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list

      - name: Install Backend & Mobile Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r appium-tests/requirements.txt

      # ── 5. Build Android APK from Project ───────────────────────────────────
      - name: Build Standalone Android APK
        run: |
          cd mobile
          npm install
          echo "Running Expo prebuild for Android..."
          npx expo prebuild --platform android --clean || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || true
            cd ..
          fi
          
          # Check generated APK location
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "Successfully generated APK at: mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "APK build in progress or running in package mode"
          fi

      # ── 6. Start FastAPI Backend Service ────────────────────────────────────
      - name: Start FastAPI Backend Service
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend &
          echo "Waiting for FastAPI backend to initialize..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/ > /dev/null; do sleep 1; done'
          echo "FastAPI backend is ready!"

      # ── 7. Run Android Emulator & Appium Tests ──────────────────────────────
      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-ubuntu

      - name: Create AVD and Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        id: run_appium_tests
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p appium-tests/reports/screenshots appium-tests/reports/logs
            
            # Install the generated APK if available
            if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
              echo "Installing generated APK into emulator: $APK_PATH"
              adb install -r "$APK_PATH" || true
            fi

            # Start Appium Server in background
            appium --log appium-tests/reports/logs/appium_server.log --port 4723 &
            echo "Waiting for Appium server on port 4723..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready!"
                break
              fi
              sleep 1
            done

            # Execute Pytest Mobile Test Suite
            APP_PATH="$APK_PATH" pytest appium-tests/tests \
              --html=appium-tests/reports/appium-test-report.html \
              --self-contained-html \
              -v

      # ── 8. Generate 300 Test Cases Excel Matrix ─────────────────────────────
      - name: Generate Appium 300 Test Cases Excel Matrix
        if: always()
        run: |
          python appium-tests/generate_report.py

      # ── 9. Generate Step Summary for GitHub Actions ─────────────────────────
      - name: Publish Test Summary to GitHub Actions
        if: always()
        run: |
          echo "### 📱 Appium Mobile Automation Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_appium_tests.outcome }}" == "success" ]; then
            echo "Status: **✅ PASSED (Mobile test suites completed successfully)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: **⚠️ REVIEW (See attached Appium reports, logs & screenshots)**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Area | Automated Scope | Test Framework | Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Launch & Auth** | Splash screen, Student/Faculty/Admin login, Token storage | Appium / UiAutomator2 | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Navigation & UI** | 5 Bottom Tabs (Home, Notices, Voice, Chatbot, Profile) | Appium / UiAutomator2 | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Campus Notices** | Notice browsing, category filter, card views | Appium / UiAutomator2 | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **AI & Voice** | Interactive AI query conversation, Voice UI mic | Appium / UiAutomator2 | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Profile & Logout** | Student record validation, session sign-out | Appium / UiAutomator2 | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test reports, logcat dumps, and failure screenshots are attached below in artifacts." >> $GITHUB_STEP_SUMMARY

      # ── 10. Upload Artifacts ────────────────────────────────────────────────
      - name: Upload Appium Test Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-Test-Reports
          path: |
            appium-tests/reports/appium-test-report.html
            appium-tests/reports/Appium_E2E_300_Test_Cases_Report.xlsx
            appium-tests/reports/screenshots/*.png
            appium-tests/reports/logs/*.log
            appium-tests/reports/logs/*.txt
          retention-days: 30
