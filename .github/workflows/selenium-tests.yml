name: Selenium Web Automation E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium-web-tests:
    name: Selenium WebDriver E2E Automation
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@smartnoticeboard.edu' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Password123!' }}
      FACULTY_EMAIL: ${{ secrets.FACULTY_EMAIL || 'faculty@smartnoticeboard.edu' }}
      FACULTY_PASSWORD: ${{ secrets.FACULTY_PASSWORD || 'Password123!' }}
      STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'student@smartnoticeboard.edu' }}
      STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD || 'Password123!' }}
      BACKEND_URL: "http://127.0.0.1:8000"
      WEB_BASE_URL: "http://127.0.0.1:5173"
      SELENIUM_HEADLESS: "true"

    steps:
      # ── 1. Checkout Repository ──────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Environment Setup ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── 3. Install Dependencies ─────────────────────────────────────────────
      - name: Install Backend & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r selenium-tests/requirements.txt

      - name: Install Web Frontend Dependencies
        run: |
          cd web
          npm ci || npm install

      # ── 4. Launch Services in Background ────────────────────────────────────
      - name: Start FastAPI Backend Service
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend &
          echo "Waiting for FastAPI server to become healthy..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/ > /dev/null; do sleep 1; done'
          echo "FastAPI backend is ready!"

      - name: Start Vite Web Frontend Server
        run: |
          cd web
          npm run dev -- --host 127.0.0.1 --port 5173 &
          echo "Waiting for Vite web server to respond on port 5173..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5173/ > /dev/null; do sleep 1; done'
          echo "Vite web frontend is ready!"

      # ── 5. Run Selenium WebDriver Test Suite ────────────────────────────────
      - name: Execute Selenium E2E Web Tests
        id: run_tests
        run: |
          mkdir -p selenium-tests/reports/screenshots
          pytest selenium-tests/tests \
            --html=selenium-tests/reports/selenium-test-report.html \
            --self-contained-html \
            -v

      # ── 6. Generate 300 Test Cases Excel Matrix ─────────────────────────────
      - name: Generate 300 Test Cases Excel Matrix
        if: always()
        run: |
          python selenium-tests/generate_report.py

      # ── 7. Generate Step Summary for GitHub Actions ─────────────────────────
      - name: Publish Test Summary to GitHub Actions
        if: always()
        run: |
          echo "### 🌐 Selenium Web E2E Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            echo "Status: **PASSED (All test suites executed successfully)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: **FAILED (Inspect test report & screenshots below)**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Area | Automated Scope | Engine | Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Authentication & RBAC** | Login, Role Dashboard, Logout, Form Validations | Chrome Headless | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dashboard & Navigation** | Student, Faculty & Admin consoles | Chrome Headless | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Campus Notices** | Create Notice Modal, Keyword Search, Pin & Delete | Chrome Headless | HTML & Excel |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test artifacts have been attached below: \`selenium-test-report.html\` and \`Selenium_E2E_300_Test_Cases_Report.xlsx\`." >> $GITHUB_STEP_SUMMARY

      # ── 8. Upload Artifacts ─────────────────────────────────────────────────
      - name: Upload Selenium Test Reports & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Web-Test-Reports
          path: |
            selenium-tests/reports/selenium-test-report.html
            selenium-tests/reports/Selenium_E2E_300_Test_Cases_Report.xlsx
            selenium-tests/reports/screenshots/*.png
          retention-days: 30

