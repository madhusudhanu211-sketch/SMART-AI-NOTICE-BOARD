name: Android Appium E2E Automation & GitHub Pages Publishing

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-e2e:
    name: Execute Appium E2E & Publish Reports
    runs-on: ubuntu-latest

    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-jwt-secret-key-smart-notice-board-2026' }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@smartnoticeboard.edu' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Password123!' }}
      FACULTY_EMAIL: ${{ secrets.FACULTY_EMAIL || 'faculty@smartnoticeboard.edu' }}
      FACULTY_PASSWORD: ${{ secrets.FACULTY_PASSWORD || 'Password123!' }}
      STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'student@smartnoticeboard.edu' }}
      STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD || 'Password123!' }}
      BACKEND_URL: "http://127.0.0.1:8000"
      APPIUM_SERVER_URL: "http://127.0.0.1:4723"
      ANDROID_DEVICE_NAME: "emulator-5554"
      ANDROID_PLATFORM_VERSION: "10.0"
      APP_PACKAGE: "com.smartnoticeboard.app"
      APP_ACTIVITY: ".MainActivity"

    steps:
      # ── 1. Checkout Source Code ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup KVM Hardware Acceleration ──────────────────────────────────
      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Checking KVM acceleration support on Ubuntu runner..."
          ls -l /dev/kvm || true
          sudo chmod 777 /dev/kvm || true

      # ── 3. Setup Android, Java, Python & Node.js ────────────────────────────
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      # ── 4. Install Appium 2 & UiAutomator2 Driver ───────────────────────────
      - name: Install Appium & Android UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list

      - name: Install Backend & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r appium-tests/requirements.txt

      # ── 5. Build Standalone Android APK ─────────────────────────────────────
      - name: Generate Android APK from Project
        run: |
          cd mobile
          npm install
          echo "Executing Expo Android prebuild..."
          npx expo prebuild --platform android --clean || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || true
            cd ..
          fi

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=$GITHUB_WORKSPACE/mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "Found compiled APK: mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

      # ── 6. Start FastAPI Backend Service ────────────────────────────────────
      - name: Start FastAPI Backend Service
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend &
          echo "Waiting for FastAPI backend to initialize..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/ > /dev/null; do sleep 1; done'
          echo "FastAPI backend is ready!"

      # ── 7. Start Android Emulator & Execute Appium E2E Tests ────────────────
      - name: AVD Cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29-ubuntu

      - name: Launch Emulator, Install APK & Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        id: run_e2e
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p appium-tests/reports/screenshots appium-tests/reports/logs

            # Install APK if generated
            if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
              echo "Installing APK into emulator: $APK_PATH"
              adb install -r "$APK_PATH" || true
            fi

            # Start Appium Server in background
            appium --log appium-tests/reports/logs/appium_server.log --port 4723 &
            echo "Waiting for Appium server..."
            for i in {1..30}; do
              if curl -s http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready on port 4723!"
                break
              fi
              sleep 1
            done

            # Run Pytest Appium E2E Test Suite
            APP_PATH="$APK_PATH" pytest appium-tests/tests \
              --html=appium-tests/reports/appium-test-report.html \
              --self-contained-html \
              -v

      # ── 8. Generate Excel & Reports ─────────────────────────────────────────
      - name: Generate Automation Test Reports
        if: always()
        run: |
          python appium-tests/generate_report.py
          python appium-tests/prepare_pages_report.py

      # ── 9. Publish GitHub Actions Summary ───────────────────────────────────
      - name: Display Appium Test Summary
        if: always()
        run: |
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY

      # ── 10. Upload All Artifacts ────────────────────────────────────────────
      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Test-Results-Build-${{ github.run_number }}
          path: |
            Test Results/
          retention-days: 30

      # ── 11. Publish HTML Reports to GitHub Pages ────────────────────────────
      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          keep_files: true
          commit_message: "docs(reports): Publish Appium E2E Report for Build #${{ github.run_number }} [skip ci]"
