name: Generate & Upload Appium, Selenium, and Live Test Excel Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate-test-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run Appium 300 Test Cases Excel Report Generator
        run: |
          python appium-tests/generate_report.py

      - name: Run Selenium 300 Test Cases Excel Report Generator
        run: |
          python selenium-tests/generate_report.py

      - name: Run Live System 300 Test Cases Excel Report Generator
        run: |
          python live_test/run_live_tests.py

      - name: Upload Test Reports as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Notice-Board-Test-Reports-Excel
          path: |
            appium-tests/reports/*.xlsx
            selenium-tests/reports/*.xlsx
            live_test/reports/*.xlsx
            *.md
          retention-days: 30

      - name: Commit & Push Generated Excel Reports (if updated)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): Auto-generate Appium, Selenium & Live Test Excel Reports [skip ci]"
          file_pattern: "appium-tests/reports/*.xlsx selenium-tests/reports/*.xlsx live_test/reports/*.xlsx *.md"

