name: Deploy Test Reports to GitHub Pages

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-reports:
    name: Re-publish Reports to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Generate Reports and Prepare Pages Directory
        run: |
          python appium-tests/generate_report.py
          python appium-tests/prepare_pages_report.py

      - name: Display Test Summary in GitHub Actions
        run: |
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Results-Manual
          path: |
            Test Results/
          retention-days: 30

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          keep_files: true
          commit_message: "docs(reports): Manual publish Appium E2E Report to GitHub Pages [skip ci]"

