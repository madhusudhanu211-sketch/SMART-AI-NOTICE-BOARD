[pytest]
testpaths = appium-tests/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=appium-tests/reports/appium-test-report.html --self-contained-html
markers =
    mobile_auth: Mobile login and logout tests
    mobile_nav: Tab and stack navigation tests
    mobile_notices: Mobile notice browsing and details tests
    mobile_ai: Chatbot and voice assistant tests

